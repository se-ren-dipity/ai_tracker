x-worker: &worker
  build: .
  image: ai-tracker:current
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  volumes:
    - ./data:/app/data
  environment: &environment
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    DB_PATH: /app/data/tracker.db
    COLLECTOR_PROXY: ${COLLECTOR_PROXY:-}
    MODEL_AUTO_REVIEW_ENABLED: ${MODEL_AUTO_REVIEW_ENABLED:-false}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mcp:
    <<: *worker
    profiles: ["mcp"]
    command: ["python", "-m", "backend.mcp_server", "--transport", "streamable-http", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:${MCP_PORT:-29012}:8001"
    environment:
      <<: *environment
      MCP_READ_TOKEN: ${MCP_READ_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    <<: *worker
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-29011}:8000"
    environment:
      <<: *environment
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  collector:
    <<: *worker
    command: ["python", "-m", "backend.collector.collection_worker"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "backend.runtime", "collector"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  model-worker:
    <<: *worker
    command: ["python", "-m", "backend.collector.model_worker"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "backend.runtime", "models"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
